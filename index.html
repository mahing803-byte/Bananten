<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BANANA TEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--brown:#5A3415;--brown2:#8A5527;--orange:#F5841F;--cream:#FFF8E7;--yellow:#FFD93B;--leaf:#5FAE3A;--leaf2:#8BCB4A;--red:#E5533D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Jua',system-ui,sans-serif;color:var(--brown);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 18%,#FFFBE6 0,#F1F9D6 35%,#CFEBA6 75%,#A9D97A 100%)}
/* 정글 배경 */
.jungle{position:fixed;inset:0;pointer-events:none;z-index:0}
.jungle svg{position:absolute}
.app{position:relative;z-index:1;height:100dvh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
/* 상단 */
header{display:flex;align-items:center;gap:6px}
.mkWrap{position:relative;width:78px;height:78px;flex:none}
.mkWrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(90,52,21,.25))}
.mkWrap.bounce img{animation:bounce .45s}
.mkWrap.shake img{animation:shake .35s}
.fx{position:absolute;font-size:22px;opacity:0;transition:opacity .15s;pointer-events:none}
.fx.sweat{top:4px;right:0}
.fx.crown{top:-12px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:26px}
.fx.spark{top:6px;left:-4px;font-size:18px}
.mkWrap[data-face=sad] .sweat,.mkWrap[data-face=best] .crown,.mkWrap[data-face=best] .spark{opacity:1}
.logo{flex:1;min-width:0}
.logo h1{font-size:34px;line-height:1;font-weight:400;letter-spacing:1px;color:var(--yellow);
  text-shadow:3.0px 0.0px 0 var(--brown),2.8px 1.1px 0 var(--brown),2.1px 2.1px 0 var(--brown),1.1px 2.8px 0 var(--brown),0.0px 3.0px 0 var(--brown),-1.1px 2.8px 0 var(--brown),-2.1px 2.1px 0 var(--brown),-2.8px 1.1px 0 var(--brown),-3.0px 0.0px 0 var(--brown),-2.8px -1.1px 0 var(--brown),-2.1px -2.1px 0 var(--brown),-1.1px -2.8px 0 var(--brown),-0.0px -3.0px 0 var(--brown),1.1px -2.8px 0 var(--brown),2.1px -2.1px 0 var(--brown),2.8px -1.1px 0 var(--brown),0 5px 0 var(--brown)}
.logo h1 span{color:#FFF3B0}
.logo p{display:inline-block;margin-top:7px;font-size:13px;background:rgba(255,255,255,.75);border-radius:20px;padding:3px 10px}
/* 점수판 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:linear-gradient(#FFFDF4,#FFF1CC);border:3px solid var(--brown);border-radius:16px;padding:4px 6px 5px;text-align:center;box-shadow:0 3px 0 var(--brown)}
.stat small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--brown2)}
.stat b{font-size:24px;font-weight:400;display:inline-block;line-height:1.1}
.stat b.pop{animation:pop .3s}
.stat.low{background:linear-gradient(#FFE9E3,#FFC9BE)}
.stat.low b{color:var(--red)}
.bar{height:14px;background:#FFFDF4;border:3px solid var(--brown);border-radius:10px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:6px;transition:width .1s linear;
  background:repeating-linear-gradient(-45deg,#9BD45A 0 8px,#82C443 8px 16px)}
.bar i.low{background:repeating-linear-gradient(-45deg,#F4816D 0 8px,#E5533D 8px 16px)}
/* 게임판 */
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{padding:7px;border-radius:24px;background:linear-gradient(#B9773D,#8A5527);border:3px solid var(--brown);box-shadow:0 5px 0 var(--brown),inset 0 2px 0 rgba(255,255,255,.3)}
.board{position:relative;display:grid;gap:5px;padding:7px;border-radius:17px;
  background:radial-gradient(circle at 30% 20%,#B8E58A,#8FCB5C);box-shadow:inset 0 3px 6px rgba(0,0,0,.18)}
.tile{position:relative;aspect-ratio:1;border-radius:12px;cursor:pointer;
  background:linear-gradient(#FFFEF8,#FFF1CF);border:2.5px solid var(--brown);box-shadow:0 3px 0 var(--brown);
  display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s,box-shadow .12s}
.tile svg{position:absolute;inset:6%;width:88%;height:88%}
.tile span{position:relative;font-size:calc(var(--fs,22px) * 1.25);line-height:1;padding-top:2px;color:var(--brown);
  text-shadow:2.5px 0.0px 0 #fff,2.3px 1.0px 0 #fff,1.8px 1.8px 0 #fff,1.0px 2.3px 0 #fff,0.0px 2.5px 0 #fff,-1.0px 2.3px 0 #fff,-1.8px 1.8px 0 #fff,-2.3px 1.0px 0 #fff,-2.5px 0.0px 0 #fff,-2.3px -1.0px 0 #fff,-1.8px -1.8px 0 #fff,-1.0px -2.3px 0 #fff,-0.0px -2.5px 0 #fff,1.0px -2.3px 0 #fff,1.8px -1.8px 0 #fff,2.3px -1.0px 0 #fff}
.tile:active{transform:scale(.93)}
.tile.drop{animation:drop .35s backwards}
.tile.sel{background:linear-gradient(#FFF06A,#FFD12B);transform:translateY(-3px) scale(1.06);z-index:2;
  box-shadow:0 0 0 3px #fff,0 0 0 6px #FFC21A,0 6px 0 var(--brown),0 0 18px 6px rgba(255,217,59,.8)}
.tile.bad{background:#FFC9BE;animation:shake .3s}
.tile.gone{animation:vanish .38s forwards;pointer-events:none}
.combo .rd{margin-left:auto;font-size:16px;color:var(--brown2)}
.tile.empty{visibility:hidden;pointer-events:none}
.float{position:absolute;font-size:22px;color:var(--yellow);pointer-events:none;animation:float .85s forwards;z-index:5;white-space:nowrap;
  text-shadow:2.5px 0.0px 0 var(--brown),2.3px 1.0px 0 var(--brown),1.8px 1.8px 0 var(--brown),1.0px 2.3px 0 var(--brown),0.0px 2.5px 0 var(--brown),-1.0px 2.3px 0 var(--brown),-1.8px 1.8px 0 var(--brown),-2.3px 1.0px 0 var(--brown),-2.5px 0.0px 0 var(--brown),-2.3px -1.0px 0 var(--brown),-1.8px -1.8px 0 var(--brown),-1.0px -2.3px 0 var(--brown),-0.0px -2.5px 0 var(--brown),1.0px -2.3px 0 var(--brown),1.8px -1.8px 0 var(--brown),2.3px -1.0px 0 var(--brown)}
.burst{position:absolute;pointer-events:none;z-index:4;font-size:16px;animation:burst .6s forwards}
/* 하단 */
footer{display:flex;gap:8px}
.combo{flex:1;display:flex;align-items:center;gap:8px;background:linear-gradient(#FFFDF4,#FFF1CC);border:3px solid var(--brown);border-radius:16px;padding:6px 12px;font-size:18px;box-shadow:0 3px 0 var(--brown);transition:background .2s}
.combo b{font-weight:400;font-size:28px;color:var(--orange);text-shadow:2.0px 0.0px 0 var(--brown),1.8px 0.8px 0 var(--brown),1.4px 1.4px 0 var(--brown),0.8px 1.8px 0 var(--brown),0.0px 2.0px 0 var(--brown),-0.8px 1.8px 0 var(--brown),-1.4px 1.4px 0 var(--brown),-1.8px 0.8px 0 var(--brown),-2.0px 0.0px 0 var(--brown),-1.8px -0.8px 0 var(--brown),-1.4px -1.4px 0 var(--brown),-0.8px -1.8px 0 var(--brown),-0.0px -2.0px 0 var(--brown),0.8px -1.8px 0 var(--brown),1.4px -1.4px 0 var(--brown),1.8px -0.8px 0 var(--brown)}
.combo.hot{background:linear-gradient(#FFF06A,#FFC21A)}
button{font-family:inherit;font-size:19px;color:#fff;background:linear-gradient(#9BD45A,#5FAE3A);border:3px solid var(--brown);border-radius:16px;
  padding:8px 16px;box-shadow:0 4px 0 var(--brown);cursor:pointer;text-shadow:2.0px 0.0px 0 var(--brown),1.8px 0.8px 0 var(--brown),1.4px 1.4px 0 var(--brown),0.8px 1.8px 0 var(--brown),0.0px 2.0px 0 var(--brown),-0.8px 1.8px 0 var(--brown),-1.4px 1.4px 0 var(--brown),-1.8px 0.8px 0 var(--brown),-2.0px 0.0px 0 var(--brown),-1.8px -0.8px 0 var(--brown),-1.4px -1.4px 0 var(--brown),-0.8px -1.8px 0 var(--brown),-0.0px -2.0px 0 var(--brown),0.8px -1.8px 0 var(--brown),1.4px -1.4px 0 var(--brown),1.8px -0.8px 0 var(--brown)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
/* 결과 */
.modal{position:fixed;inset:0;background:rgba(60,35,10,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.card{max-height:94dvh;overflow:auto}
.nick{width:100%;font-family:inherit;font-size:22px;text-align:center;color:var(--brown);background:#fff;border:3px solid var(--brown);border-radius:14px;padding:8px;margin:6px 0 4px;outline:none}
.nick:focus{box-shadow:0 0 0 4px var(--yellow)}
.hint{font-size:13px;color:var(--brown2);min-height:18px;margin-bottom:10px}
.hint.err{color:var(--red)}
.rank{margin-top:14px;text-align:left;background:#fff;border:3px solid var(--brown);border-radius:16px;padding:8px 10px}
.rank h3{font-size:18px;font-weight:400;text-align:center;margin-bottom:4px}
.rank ol{list-style:none;max-height:230px;overflow:auto}
.rank li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:10px;font-size:17px}
.rank li+li{border-top:1px dashed #E5D3AE}
.rank li.me{background:#FFF3B0}
.rank .no{width:28px;text-align:center;flex:none}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{color:var(--orange)}
.rank .empty{text-align:center;font-size:14px;color:var(--brown2);padding:8px 0}
.rank .note{font-size:12px;color:var(--brown2);text-align:center;margin-top:4px}
.card{position:relative;width:min(100%,340px);background:linear-gradient(#FFFDF4,#FFF1CC);border:4px solid var(--brown);border-radius:28px;padding:18px 20px 20px;text-align:center;box-shadow:0 7px 0 var(--brown);animation:pop .35s}
.card h2{font-size:40px;font-weight:400;color:var(--yellow);text-shadow:3.0px 0.0px 0 var(--brown),2.8px 1.1px 0 var(--brown),2.1px 2.1px 0 var(--brown),1.1px 2.8px 0 var(--brown),0.0px 3.0px 0 var(--brown),-1.1px 2.8px 0 var(--brown),-2.1px 2.1px 0 var(--brown),-2.8px 1.1px 0 var(--brown),-3.0px 0.0px 0 var(--brown),-2.8px -1.1px 0 var(--brown),-2.1px -2.1px 0 var(--brown),-1.1px -2.8px 0 var(--brown),-0.0px -3.0px 0 var(--brown),1.1px -2.8px 0 var(--brown),2.1px -2.1px 0 var(--brown),2.8px -1.1px 0 var(--brown),0 5px 0 var(--brown)}
.card .mkWrap{width:130px;height:130px;margin:6px auto 2px}
.card .mkWrap .fx{font-size:30px}.card .mkWrap .crown{font-size:38px;top:-18px}
.final{font-size:56px;line-height:1}
.bonus{font-size:17px;color:var(--orange);margin-top:6px}.bonus:empty{display:none}
.best{font-size:17px;margin:6px 0 4px;color:var(--brown2)}
.msg{font-size:17px;margin-bottom:14px}
.badge{display:none;background:var(--red);color:#fff;border:2px solid var(--brown);border-radius:20px;padding:3px 12px;font-size:16px;margin:8px auto 0;width:max-content;animation:pulse 1s infinite}
.badge.show{display:block}
.card button{width:100%;font-size:24px;background:linear-gradient(#FFE45C,#FFC21A)}
.intro .mkWrap{width:150px;height:150px;margin:2px auto 0;animation:bob 2.4s ease-in-out infinite}
.name{display:inline-block;background:var(--orange);color:#fff;border:2px solid var(--brown);border-radius:12px;padding:2px 12px;font-size:16px;margin-top:6px}
.bubble{position:relative;background:#fff;border:3px solid var(--brown);border-radius:18px;padding:12px 14px;margin:10px 0 14px;font-size:19px;line-height:1.5;min-height:96px;text-align:left;word-break:keep-all}
.bubble:before{content:'';position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:12px solid var(--brown)}
.bubble:after{content:'';position:absolute;top:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom:9px solid #fff}
.bubble .cur{display:inline-block;width:2px;height:1em;background:var(--brown);vertical-align:-2px;animation:blink .8s infinite}
.btn2{margin-top:10px;background:linear-gradient(#9BD45A,#5FAE3A)!important;font-size:20px!important}
.link{background:none!important;border:0!important;box-shadow:none!important;text-shadow:none!important;color:var(--brown2)!important;font-size:15px!important;text-decoration:underline;padding:8px!important;margin-top:4px}
.who{font-size:15px;color:var(--brown2);margin-top:10px}.who:empty{display:none}
.lbl{display:block;text-align:left;font-size:14px;color:var(--brown2);margin-top:8px}
.card h2.sm{font-size:30px}
.hof{margin-top:14px;background:#fff;border:3px solid var(--brown);border-radius:16px;padding:8px 8px 6px;text-align:left}
.hof h3{font-size:20px;font-weight:400;text-align:center}
.hof .live{font-size:12px;color:var(--brown2);text-align:center;margin-bottom:6px}
.hof .live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4CB944;margin-right:4px;animation:blink 1.4s infinite}
.hof .row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:6px 8px;font-size:17px;border-radius:10px}
.hof .head{font-size:13px;color:var(--brown2);padding-top:0;padding-bottom:4px;border-bottom:2px solid #F0E2C2;border-radius:0}
.hof ol{list-style:none}
.hof li+li{border-top:1px dashed #E5D3AE}
.hof .no{text-align:center}
.hof .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hof .sc{color:var(--orange);text-align:right}
.hof .empty{text-align:center;font-size:14px;color:var(--brown2);padding:10px 0;display:block}
.myrank{font-size:16px;margin:4px 0 2px}.myrank:empty{display:none}
.ic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.2em;overflow:visible}
[data-ic]{font-style:normal}
.fx .ic{width:100%;height:100%}
.fx.sweat{width:18px;height:24px}.fx.crown{width:30px;height:25px}.fx.spark{width:20px;height:20px}
.card .mkWrap .fx.sweat{width:26px;height:34px}.card .mkWrap .fx.crown{width:46px;height:38px}.card .mkWrap .fx.spark{width:28px;height:28px}
.burst{width:18px;height:18px}.burst .ic{width:100%;height:100%}
.bubble .emo{height:1.4em;vertical-align:-.35em}
.hof .row.t3{grid-template-columns:40px 50px 1fr auto;padding:4px 8px;margin:3px 0;border-radius:14px;border:2px solid transparent}
.hof .row.t3 + .row,.hof .row + .row.t3{border-top:0}
.hof .no .ic{width:34px;height:37px;vertical-align:middle}
.hof .pic{position:relative;width:50px;height:50px}
.hof .pic img{width:100%;height:100%;object-fit:contain}
.hof .pic .ic{position:absolute;left:50%;top:-11px;width:26px;height:22px;transform:translateX(-50%) rotate(-10deg)}
.hof .r1{background:linear-gradient(90deg,#FFE27A,#FFF7D6);border-color:#E9B820!important}
.hof .r2{background:linear-gradient(90deg,#DCE3EB,#F6F8FA);border-color:#A9B4C0!important}
.hof .r3{background:linear-gradient(90deg,#F4C49A,#FFF0E2);border-color:#CF8546!important}
.hof .r1 .sc{color:#B98200}.hof .r2 .sc{color:#5E6E80}.hof .r3 .sc{color:#A85A1A}
.hof .t3 .nm,.hof .t3 .sc{font-size:19px}
.hof li.me{box-shadow:inset 0 0 0 2.5px var(--orange)}
.hof .no{color:var(--brown2)}
.cheer{display:flex;align-items:center;gap:8px;text-align:left;background:#FFF6CF;border:3px solid var(--brown);border-radius:16px;padding:6px 10px;margin:0 0 12px;font-size:16px;line-height:1.4;word-break:keep-all}
.cheer img{width:58px;height:58px;object-fit:contain;flex:none}
.cheer.in{background:#FFE98A}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes vanish{0%{transform:scale(1.1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(0) rotate(25deg);opacity:0}}
@keyframes float{0%{transform:translate(-50%,0) scale(.8);opacity:1}30%{transform:translate(-50%,-14px) scale(1.1)}100%{transform:translate(-50%,-50px);opacity:0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
@keyframes drop{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body class="notranslate">
<div class="jungle">
  <svg width="0" height="0"><defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CCB4A"/><stop offset="1" stop-color="#3E9A35"/></linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A6DD6B"/><stop offset="1" stop-color="#5FAE3A"/></linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
    <symbol id="leaf" viewBox="0 0 100 40"><path d="M2 20Q30-4 98 20Q30 44 2 20Z" fill="inherit"/><path d="M4 20H94" stroke="#2E7A2A" stroke-width="2" opacity=".5"/></symbol>
  </defs></svg>
  <svg style="left:-30px;top:-20px" width="190" height="170" viewBox="0 0 190 170">
    <use href="#leaf" fill="url(#lg)" width="150" height="60" transform="translate(-10 10) rotate(25)"/>
    <use href="#leaf" fill="url(#lg2)" width="130" height="52" transform="translate(-5 60) rotate(5)"/>
    <use href="#leaf" fill="url(#lg)" width="110" height="44" transform="translate(30 -10) rotate(55)"/>
  </svg>
  <svg style="right:-30px;top:-20px;transform:scaleX(-1)" width="190" height="170" viewBox="0 0 190 170">
    <use href="#leaf" fill="url(#lg2)" width="150" height="60" transform="translate(-10 10) rotate(25)"/>
    <use href="#leaf" fill="url(#lg)" width="130" height="52" transform="translate(-5 60) rotate(5)"/>
  </svg>
  <svg style="left:-30px;bottom:-20px" width="180" height="150" viewBox="0 0 180 150">
    <use href="#leaf" fill="url(#lg)" width="150" height="60" transform="translate(-10 120) rotate(-30)"/>
    <use href="#leaf" fill="url(#lg2)" width="120" height="48" transform="translate(10 145) rotate(-60)"/>
  </svg>
  <svg style="right:-30px;bottom:-20px;transform:scaleX(-1)" width="180" height="150" viewBox="0 0 180 150">
    <use href="#leaf" fill="url(#lg2)" width="150" height="60" transform="translate(-10 120) rotate(-30)"/>
    <use href="#leaf" fill="url(#lg)" width="120" height="48" transform="translate(10 145) rotate(-60)"/>
  </svg>
</div>

<div class="app">
  <header>
    <div class="mkWrap" id="mk" data-face="normal"><img alt="원숭이"><span class="fx sweat" data-ic="sweat"></span><span class="fx crown" data-ic="crown"></span><span class="fx spark" data-ic="spark"></span></div>
    <div class="logo"><h1>BANANA <span>TEN</span></h1><p id="subtitle"></p></div>
  </header>
  <div class="stats">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>BEST</small><b id="best">0</b></div>
    <div class="stat" id="timeBox"><small>TIME</small><b id="time">0</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <main id="main"><div class="frame"><div class="board" id="board"></div></div></main>
  <footer>
    <div class="combo" id="comboBox">COMBO <b id="combo">0</b><span class="rd"><i data-ic="banana"></i> <span id="round">1</span>판</span></div>
    <button id="restart"><i data-ic="restart"></i> 다시 시작</button>
  </footer>
</div>

<!-- 1) 인트로 -->
<div class="modal show intro" id="intro">
  <div class="card">
    <h2>BANANA TEN</h2>
    <div class="mkWrap" id="iMk" data-face="happy"><img alt="티링"><span class="fx sweat" data-ic="sweat"></span><span class="fx crown" data-ic="crown"></span><span class="fx spark" data-ic="spark"></span></div>
    <span class="name">티링</span>

// ===== Supabase 연결 정보 (Vercel 주소에서 공용 랭킹을 쓰려면 채움) =====
const SUPABASE_URL = '';   // 예: https://abcd1234.supabase.co
const SUPABASE_KEY = '';   // Project API keys 의 anon public 키
const SESSION_KEY = 'bananaTenSession';

// mode: 'claude'(claude.ai 저장소) | 'supa'(Supabase) | 'local'(이 기기만)
let mode = 'local', me = null, ranks = [], rankState = 'loading', canWrite = true;
let db = null, myId = null, myDoc = null, remoteBest = 0, pollTimer = null;
const clean = d => ({ nick: String(d.nick || '???').slice(0, 10), best: Math.max(0, Math.floor(+d.best || 0)), at: +d.at || 0 });
const keyOf = n => n.toLowerCase();
const isMe = r => me && (mode === 'claude' ? r.id === myId : keyOf(r.nick) === keyOf(me.nick));

async function rpc(fn, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error('net ' + r.status);
  return r.json();
}

// 닉네임 등록/로그인 → {ok, nick, best} | {ok:false, reason:'taken'|'invalid'|'net'}
async function login(nick, pin){
  try {
    if (mode === 'supa'){
      const r = await rpc('bt_login', { p_nick:nick, p_pin:pin });
      return r.ok ? { ok:true, nick:r.nick, best:+r.best || 0 } : { ok:false, reason:r.reason || 'taken' };
    }
    if (mode === 'claude'){
      const q = await db.collection('scores').where('nickKey', '==', keyOf(nick)).limit(5).get();
      if (q.docs.some(d => d.id !== myId)) return { ok:false, reason:'taken' };
      const cur = await myDoc.get(), c = cur.exists ? clean(cur.data()) : { best:0, at:Date.now() };
      remoteBest = c.best;
      if (canWrite){
        try { await myDoc.set({ nick, nickKey:keyOf(nick), best:c.best, at:c.at || Date.now() }); }
        catch (e){ if (e && e.code === 'invalid_argument') canWrite = false; }
      }
      return { ok:true, nick, best:c.best };
    }
    return { ok:true, nick, best: +ls.get(KEY) || 0 };
  } catch { return { ok:false, reason:'net' }; }
}

// 점수 제출(서버에서 최고 점수만 유지)
let saving = Promise.resolve();
function submit(sc){
  if (!me) return;
  if (mode === 'local'){ ls.set(KEY, best); return; }
  saving = saving.then(async () => {
    if (mode === 'supa'){ await rpc('bt_submit', { p_nick:me.nick, p_pin:me.pin, p_score:sc }); refreshRanks(); }
    else if (mode === 'claude' && canWrite && sc > remoteBest){
      await myDoc.set({ nick:me.nick, nickKey:keyOf(me.nick), best:sc, at:Date.now() }); remoteBest = sc;
    }
  }).catch(e => { if (e && e.code === 'invalid_argument'){ canWrite = false; renderRanks(); } });
}

// 명예의 전당
async function refreshRanks(){
  if (mode !== 'supa' || document.hidden) return;
  try {
    const rows = await rpc('bt_ranking', { p_limit:30 });
    ranks = rows.map(clean); rankState = 'live';
  } catch { rankState = 'error'; }
  renderRanks();
}
function watchRanks(){
  if (mode === 'supa'){ refreshRanks(); clearInterval(pollTimer); pollTimer = setInterval(refreshRanks, 5000); document.addEventListener('visibilitychange', refreshRanks); return; }
  if (mode !== 'claude'){ rankState = 'local'; return renderRanks(); }
  const slow = setTimeout(() => { if (rankState === 'loading'){ rankState = 'slow'; renderRanks(); } }, 10000);
  db.collection('scores').orderBy('best', 'desc').limit(60).onSnapshot(snap => {
    // 동점이면 먼저 달성한 사람이 위 → 같은 순위 없음
    ranks = snap.docs.map(x => ({ id:x.id, ...clean(x.data()) })).filter(r => r.best > 0)
      .sort((a, b) => b.best - a.best || a.at - b.at).slice(0, 30);
    if (!snap.metadata.fromCache){ clearTimeout(slow); rankState = 'live'; }
    renderRanks();
  }, () => { clearTimeout(slow); rankState = 'error'; renderRanks(); });
}
function myRank(){ const i = ranks.findIndex(isMe); return i < 0 ? 0 : i + 1; }
function renderRanks(){
  const live = rankState === 'live' ? (mode === 'claude' && !canWrite ? '랭킹 등록 권한이 없어 보기만 가능해요' : '<i></i>실시간 갱신 중')
    : rankState === 'local' ? '온라인 랭킹 연결 전이에요 · 기록은 이 기기에만 저장돼요'
    : rankState === 'error' ? '랭킹 서버에 연결할 수 없어요 · 잠시 후 다시 시도해요'
    : rankState === 'slow' ? '랭킹 연결이 늦어지고 있어요…' : '랭킹 불러오는 중…';
  document.querySelectorAll('[data-live]').forEach(e => e.innerHTML = live);
  const list = rankState === 'local' ? (me && best > 0 ? [{ nick:me.nick, best }] : []) : ranks;
  document.querySelectorAll('[data-hof]').forEach(ol => {
    ol.innerHTML = '';
    if (!list.length){ const li = document.createElement('li'); li.className = 'empty'; li.textContent = '아직 기록이 없어요. 1등의 주인공이 되어 보세요!'; ol.appendChild(li); }
    list.slice(0, 7).forEach((r, i) => {   // 명예의 전당은 7위까지
      const li = document.createElement('li'), t3 = i < 3;
      li.className = 'row' + (t3 ? ` t3 r${i + 1}` : '') + (isMe(r) ? ' me' : '');
      // 1위: 웃음+왕관 / 2위: 눈웃음 / 3위: 윙크
      li.innerHTML = t3 ? `<span class="no">${medal(i + 1)}</span><span class="pic"><img alt="티링" src="${IMG['r' + (i + 1)]}">${i === 0 ? ICON.crown : ''}</span><span class="nm"></span><span class="sc"></span>`
        : `<span class="no">${i + 1}위</span><span class="nm"></span><span class="sc"></span>`;
      li.querySelector('.nm').textContent = r.nick; li.querySelector('.sc').textContent = r.best.toLocaleString();
      ol.appendChild(li);
    });
  });
  updateCheer();
}
// 결과 화면: 현재 순위 + 명예의 전당 진입 여부 응원 멘트
let lastScore = null;
function updateCheer(){
  const box = $('rCheer');
  if (lastScore === null || mode === 'local' || !me || rankState !== 'live'){ box.hidden = true; $('rRank').textContent = ''; return; }
  const others = ranks.filter(r => !isMe(r)), place = best > 0 ? others.filter(r => r.best >= best).length + 1 : 0;
  $('rRank').textContent = place ? (place > 30 && others.length >= 30 ? '현재 순위 30위 밖' : `현재 순위 ${place}위`) : '';
  const inHall = place && place <= 7;
  box.hidden = false; box.classList.toggle('in', !!inHall);
  box.querySelector('img').src = inHall ? IMG['r' + Math.min(place, 3)] : IMG.smile;
  const seventh = others[6], gap = seventh ? seventh.best - best + 1 : 0;
  box.querySelector('p').textContent = inHall ? `우와! 명예의 전당 ${place}위에 이름을 올렸어! 이 기록 지켜 보자!`
    : best > 0 ? `아쉽게 명예의 전당에는 못 들어갔어. 7위까지 ${gap.toLocaleString()}점 남았어! 조금만 더 힘내서 명예의 전당에 올라가 보자! 티링이 응원할게!`
    : '바나나를 맞혀 점수를 쌓아 보자! 조금만 더 힘내면 명예의 전당에 올라갈 수 있어!';
}

const mk = $('mk'), board = $('board');
board.style.gridTemplateColumns = `repeat(${COLS},1fr)`;

function setFace(f, el = mk){ el.dataset.face = f; el.querySelector('img').src = IMG[FACE_IMG[f]]; }
function baseFace(){ return startBest > 0 && score > startBest ? 'best' : 'normal'; }
function flashFace(f, anim){
  setFace(f); mk.classList.remove('bounce','shake'); void mk.offsetWidth; mk.classList.add(anim);
  clearTimeout(faceTimer); faceTimer = setTimeout(() => setFace(baseFace()), 800);
}
function bump(id, v){ const e = $(id); e.textContent = v; e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }

// 게임판을 남은 공간에 맞춰 최대 크기로
function fit(){
  const m = $('main'), pad = 34, gap = 5;
  const w = Math.min(m.clientWidth - pad, (m.clientHeight - pad - gap*(ROWS-1)) * COLS/ROWS + gap*(COLS-1));
  board.style.width = Math.max(200, w) + 'px';
  board.style.setProperty('--fs', Math.max(14, w/COLS*0.36) + 'px');
}

// 합 10 쌍을 섞어 생성 → 항상 전부 제거 가능
function makeNumbers(){
  const a = [];
  for (let i = 0; i < N/2; i++){ const n = 1 + Math.floor(Math.random()*9); a.push(n, 10 - n); }
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newBoard(anim){
  nums = makeNumbers(); removed = Array(N).fill(false); sel = []; left = N;
  board.innerHTML = nums.map((n,i) => `<div class="tile${anim ? ' drop' : ''}" data-i="${i}" style="animation-delay:${anim ? (i % COLS + Math.floor(i / COLS)) * 18 : 0}ms">${BANANA}<span>${n}</span></div>`).join('');
}
function prepare(){
  score = 0; combo = 0; round = 1; lock = false; playing = false; startBest = best;
  $('round').textContent = 1;
  $('score').textContent = 0; $('best').textContent = best; $('combo').textContent = 0;
  $('comboBox').classList.remove('hot'); $('modal').classList.remove('show');
  newBoard(false);
  setFace('normal'); fit();
  clearInterval(timer); $('time').textContent = LIMIT; $('bar').style.width = '100%';
  $('bar').classList.remove('low'); $('timeBox').classList.remove('low');
}
function go(){
  playing = true; endAt = performance.now() + LIMIT*1000;
  clearInterval(timer); timer = setInterval(tick, 100); tick();
}
function start(){ prepare(); go(); }

function tick(){
  const t = Math.max(0, (endAt - performance.now())/1000), low = t <= 10;
  $('time').textContent = Math.ceil(t);
  $('bar').style.width = (t/LIMIT*100) + '%';
  $('bar').classList.toggle('low', low); $('timeBox').classList.toggle('low', low);
  if (t <= 0) end();
}

function tap(i){
  if (!playing || lock || removed[i]) return;
  const tile = board.children[i];
  if (sel.includes(i)){ sel = sel.filter(x => x !== i); tile.classList.remove('sel'); return; }
  sel.push(i); tile.classList.add('sel');
  if (sel.length === 2) check();
}

function check(){
  const [a, b] = sel, ta = board.children[a], tb = board.children[b];
  sel = [];
  if (nums[a] + nums[b] === 10){
    combo++;
    const gain = 20 + 5*(combo - 1);
    score += gain; removed[a] = removed[b] = true; left -= 2;
    bump('score', score); bump('combo', combo);
    $('comboBox').classList.toggle('hot', combo >= 2);
    if (score > best) $('best').textContent = score;
    [ta, tb].forEach(t => { t.classList.remove('sel'); t.classList.add('gone'); effects(t); });
    floatText(ta, tb, combo >= 2 ? `+${gain} ${combo}COMBO!` : `+${gain}`);
    setTimeout(() => [ta, tb].forEach(t => t.classList.replace('gone','empty')), 390);
    flashFace(startBest > 0 && score > startBest ? 'best' : 'happy', 'bounce');
    if (left === 0){
      // 판을 비우면 보너스 +100, 콤보 유지한 채 새 판으로 계속
      lock = true; score += 100; round++;
      setTimeout(() => {
        bump('score', score); $('round').textContent = round;
        const f = document.createElement('div'); f.className = 'float'; f.textContent = `CLEAR +100! ${round}판`;
        f.style.cssText = `left:50%;top:40%`;
        newBoard(true); board.appendChild(f); setTimeout(() => f.remove(), 850);
        if (score > best) $('best').textContent = score;
        lock = false;
      }, 420);
    }
  } else {
    combo = 0; bump('combo', 0); $('comboBox').classList.remove('hot');
    lock = true;
    [ta, tb].forEach(t => { t.classList.remove('sel'); t.classList.add('bad'); });
    flashFace('sad', 'shake');
    setTimeout(() => { [ta, tb].forEach(t => t.classList.remove('bad')); lock = false; }, 320);
  }
}

function center(t){
  const r = board.getBoundingClientRect(), q = t.getBoundingClientRect();
  return [q.left + q.width/2 - r.left, q.top + q.height/2 - r.top];
}
function effects(t){
  const [x, y] = center(t);
  for (let k = 0; k < 4; k++){
    const s = document.createElement('div'), ang = Math.PI/2*k + Math.PI/4;
    s.className = 'burst'; s.innerHTML = ICON.spark;
    s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(ang)*30}px;--dy:${Math.sin(ang)*30}px`;
    board.appendChild(s); setTimeout(() => s.remove(), 600);
  }
}
function floatText(ta, tb, txt){
  const [x1, y1] = center(ta), [x2, y2] = center(tb);
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = txt;
  f.style.left = Math.min(Math.max((x1+x2)/2, 60), board.clientWidth - 60) + 'px';
  f.style.top = ((y1+y2)/2 - 30) + 'px';
  board.appendChild(f); setTimeout(() => f.remove(), 850);
}

function end(){
  if (!playing) return;
  playing = false; clearInterval(timer); clearTimeout(faceTimer);
  $('score').textContent = score;
  const newBest = score > startBest;
  if (newBest){ best = score; submit(score); }
  $('best').textContent = best;
  const face = newBest && score > 0 ? 'best' : score >= 500 ? 'happy' : score >= 150 ? 'normal' : 'sad';
  setFace(face); setFace(face, $('rMk'));
  $('rTitle').textContent = 'TIME UP!';
  $('rScore').textContent = score; $('rBest').textContent = best;
  $('rBonus').textContent = round > 1 ? `비운 판 ${round - 1}개 · 판 보너스 +${(round - 1)*100}` : '';
  $('rBadge').classList.toggle('show', newBest && score > 0);
  $('rMsg').textContent = { best:'내 최고 기록을 갈아치웠어!', happy:'우와, 바나나 고수! 한 번 더?', normal:'좋아! 콤보를 이어 보자!', sad:'아쉬워… 다시 해 보자!' }[face];
  lastScore = score; renderRanks();
  setTimeout(() => $('modal').classList.add('show'), 300);
}

const ready = (async () => {
  const use = window.claude && window.claude.use;
  if (use){
    try {
      const [d, u] = await Promise.all([use('db'), use('user')]);
      myId = u ? await u.id() : null;

        if (u.can && (await u.can('data.write')) === false) canWrite = false; }
    } catch {}

  watchRanks();

  if (mode === 'claude'){
    try { const cur = await myDoc.get(); if (cur.exists){ const c = clean(cur.data()); remoteBest = c.best; setMe(c); } } catch {}
  } else if (saved && saved.nick){
    const r = await login(saved.nick, saved.pin);
    if (r.ok) setMe(r, saved.pin);
    else if (r.reason !== 'net') ls.del(SESSION_KEY);

})();

let busy = false;
async function doLogin(){
  if (busy) return;
  const nick = $('nick').value.trim().replace(/\s+/g, ' '), pin = $('pin').value.trim();
  if (!nick) return hint('닉네임을 입력해 주세요!', true), $('nick').focus();
  if (mode === 'supa' && !/^\d{4}$/.test(pin)) return hint('비밀번호는 숫자 4자리로 입력해 주세요!', true), $('pin').focus();
  busy = true; $('loginBtn').textContent = '확인 중…';
  const r = await login(nick, pin);
  busy = false; $('loginBtn').textContent = '확인';
  if (!r.ok){
    return hint(r.reason === 'net' ? '연결이 안 돼요. 잠시 후 다시 눌러 주세요.'
      : r.reason === 'invalid' ? '닉네임 1~10자, 비밀번호 숫자 4자리로 입력해 주세요.'
      : mode === 'supa' ? '이미 있는 닉네임이에요. 내 닉네임이면 비밀번호를 확인하고, 아니면 다른 닉네임을 써 주세요.'
      : '이미 사용 중인 닉네임이에요. 다른 닉네임을 써 주세요.', true);
  }
  setMe(r, pin); $('nick').blur(); $('pin').blur();
  show(null); start();
}
$('loginBtn').onclick = doLogin;
$('nick').addEventListener('keydown', e => { if (e.key === 'Enter') mode === 'supa' ? $('pin').focus() : doLogin(); });
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
['nick','pin'].forEach(id => $(id).addEventListener('input', () => $('hint').classList.remove('err')));

paintIcons();
setFace('happy', $('iMk'));
prepare(); renderRanks(); typeIntro(); updateWho();
</script>
</body>
</html>
