<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BANANA TEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--brown:#5A3415;--brown2:#8A5527;--orange:#F5841F;--cream:#FFF8E7;--yellow:#FFD93B;--leaf:#5FAE3A;--leaf2:#8BCB4A;--red:#E5533D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Jua',system-ui,sans-serif;color:var(--brown);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 18%,#FFFBE6 0,#F1F9D6 35%,#CFEBA6 75%,#A9D97A 100%)}
/* 정글 배경 */
.jungle{position:fixed;inset:0;pointer-events:none;z-index:0}
.jungle svg{position:absolute}
.app{position:relative;z-index:1;height:100dvh;max-width:500px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);gap:8px}
/* 상단 */
header{display:flex;align-items:center;gap:6px}
.mkWrap{position:relative;width:78px;height:78px;flex:none}
.mkWrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(90,52,21,.25))}
.mkWrap.bounce img{animation:bounce .45s}
.mkWrap.shake img{animation:shake .35s}
.fx{position:absolute;font-size:22px;opacity:0;transition:opacity .15s;pointer-events:none}
.fx.sweat{top:4px;right:0}
.fx.crown{top:-12px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:26px}
.fx.spark{top:6px;left:-4px;font-size:18px}
.mkWrap[data-face=sad] .sweat,.mkWrap[data-face=best] .crown,.mkWrap[data-face=best] .spark{opacity:1}
.logo{flex:1;min-width:0}
.logo h1{font-size:34px;line-height:1;font-weight:400;letter-spacing:1px;color:var(--yellow);
  -webkit-text-stroke:6px var(--brown);paint-order:stroke fill;text-shadow:0 4px 0 var(--brown)}
.logo h1 span{color:#FFF3B0}
.logo p{display:inline-block;margin-top:7px;font-size:13px;background:rgba(255,255,255,.75);border-radius:20px;padding:3px 10px}
/* 점수판 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:linear-gradient(#FFFDF4,#FFF1CC);border:3px solid var(--brown);border-radius:16px;padding:4px 6px 5px;text-align:center;box-shadow:0 3px 0 var(--brown)}
.stat small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--brown2)}
.stat b{font-size:24px;font-weight:400;display:inline-block;line-height:1.1}
.stat b.pop{animation:pop .3s}
.stat.low{background:linear-gradient(#FFE9E3,#FFC9BE)}
.stat.low b{color:var(--red)}
.bar{height:14px;background:#FFFDF4;border:3px solid var(--brown);border-radius:10px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:6px;transition:width .1s linear;
  background:repeating-linear-gradient(-45deg,#9BD45A 0 8px,#82C443 8px 16px)}
.bar i.low{background:repeating-linear-gradient(-45deg,#F4816D 0 8px,#E5533D 8px 16px)}
/* 게임판 */
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{padding:7px;border-radius:24px;background:linear-gradient(#B9773D,#8A5527);border:3px solid var(--brown);box-shadow:0 5px 0 var(--brown),inset 0 2px 0 rgba(255,255,255,.3)}
.board{position:relative;display:grid;gap:5px;padding:7px;border-radius:17px;
  background:radial-gradient(circle at 30% 20%,#B8E58A,#8FCB5C);box-shadow:inset 0 3px 6px rgba(0,0,0,.18)}
.tile{position:relative;aspect-ratio:1;border-radius:12px;cursor:pointer;
  background:linear-gradient(#FFFEF8,#FFF1CF);border:2.5px solid var(--brown);box-shadow:0 3px 0 var(--brown);
  display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s,box-shadow .12s}
.tile svg{position:absolute;inset:6%;width:88%;height:88%}
.tile span{position:relative;font-size:calc(var(--fs,22px) * 1.25);line-height:1;padding-top:2px;color:var(--brown);
  -webkit-text-stroke:5px #fff;paint-order:stroke fill;filter:drop-shadow(0 1px 0 rgba(90,52,21,.35))}
.tile:active{transform:scale(.93)}
.tile.drop{animation:drop .35s backwards}
.tile.sel{background:linear-gradient(#FFF06A,#FFD12B);transform:translateY(-3px) scale(1.06);z-index:2;
  box-shadow:0 0 0 3px #fff,0 0 0 6px #FFC21A,0 6px 0 var(--brown),0 0 18px 6px rgba(255,217,59,.8)}
.tile.bad{background:#FFC9BE;animation:shake .3s}
.tile.gone{animation:vanish .38s forwards;pointer-events:none}
.combo .rd{margin-left:auto;font-size:16px;color:var(--brown2)}
.tile.empty{visibility:hidden;pointer-events:none}
.float{position:absolute;font-size:22px;color:var(--yellow);pointer-events:none;animation:float .85s forwards;z-index:5;white-space:nowrap;
  -webkit-text-stroke:5px var(--brown);paint-order:stroke fill}
.burst{position:absolute;pointer-events:none;z-index:4;font-size:16px;animation:burst .6s forwards}
/* 하단 */
footer{display:flex;gap:8px}
.combo{flex:1;display:flex;align-items:center;gap:8px;background:linear-gradient(#FFFDF4,#FFF1CC);border:3px solid var(--brown);border-radius:16px;padding:6px 12px;font-size:18px;box-shadow:0 3px 0 var(--brown);transition:background .2s}
.combo b{font-weight:400;font-size:28px;color:var(--orange);-webkit-text-stroke:4px var(--brown);paint-order:stroke fill}
.combo.hot{background:linear-gradient(#FFF06A,#FFC21A)}
button{font-family:inherit;font-size:19px;color:#fff;background:linear-gradient(#9BD45A,#5FAE3A);border:3px solid var(--brown);border-radius:16px;
  padding:8px 16px;box-shadow:0 4px 0 var(--brown);cursor:pointer;-webkit-text-stroke:4px var(--brown);paint-order:stroke fill}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
/* 결과 */
.modal{position:fixed;inset:0;background:rgba(60,35,10,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.card{max-height:94dvh;overflow:auto}
.nick{width:100%;font-family:inherit;font-size:22px;text-align:center;color:var(--brown);background:#fff;border:3px solid var(--brown);border-radius:14px;padding:8px;margin:6px 0 4px;outline:none}
.nick:focus{box-shadow:0 0 0 4px var(--yellow)}
.hint{font-size:13px;color:var(--brown2);min-height:18px;margin-bottom:10px}
.hint.err{color:var(--red)}
.rank{margin-top:14px;text-align:left;background:#fff;border:3px solid var(--brown);border-radius:16px;padding:8px 10px}
.rank h3{font-size:18px;font-weight:400;text-align:center;margin-bottom:4px}
.rank ol{list-style:none;max-height:230px;overflow:auto}
.rank li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:10px;font-size:17px}
.rank li+li{border-top:1px dashed #E5D3AE}
.rank li.me{background:#FFF3B0}
.rank .no{width:28px;text-align:center;flex:none}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{color:var(--orange)}
.rank .empty{text-align:center;font-size:14px;color:var(--brown2);padding:8px 0}
.rank .note{font-size:12px;color:var(--brown2);text-align:center;margin-top:4px}
.card{position:relative;width:min(100%,340px);background:linear-gradient(#FFFDF4,#FFF1CC);border:4px solid var(--brown);border-radius:28px;padding:18px 20px 20px;text-align:center;box-shadow:0 7px 0 var(--brown);animation:pop .35s}
.card h2{font-size:40px;font-weight:400;color:var(--yellow);-webkit-text-stroke:7px var(--brown);paint-order:stroke fill;text-shadow:0 4px 0 var(--brown)}
.card .mkWrap{width:130px;height:130px;margin:6px auto 2px}
.card .mkWrap .fx{font-size:30px}.card .mkWrap .crown{font-size:38px;top:-18px}
.final{font-size:56px;line-height:1}
.bonus{font-size:17px;color:var(--orange);margin-top:6px}.bonus:empty{display:none}
.best{font-size:17px;margin:6px 0 4px;color:var(--brown2)}
.msg{font-size:17px;margin-bottom:14px}
.badge{display:none;background:var(--red);color:#fff;border:2px solid var(--brown);border-radius:20px;padding:3px 12px;font-size:16px;margin:8px auto 0;width:max-content;animation:pulse 1s infinite}
.badge.show{display:block}
.card button{width:100%;font-size:24px;background:linear-gradient(#FFE45C,#FFC21A)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes vanish{0%{transform:scale(1.1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(0) rotate(25deg);opacity:0}}
@keyframes float{0%{transform:translate(-50%,0) scale(.8);opacity:1}30%{transform:translate(-50%,-14px) scale(1.1)}100%{transform:translate(-50%,-50px);opacity:0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
@keyframes drop{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="jungle">
  <svg width="0" height="0"><defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CCB4A"/><stop offset="1" stop-color="#3E9A35"/></linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A6DD6B"/><stop offset="1" stop-color="#5FAE3A"/></linearGradient>
    <symbol id="leaf" viewBox="0 0 100 40"><path d="M2 20Q30-4 98 20Q30 44 2 20Z" fill="inherit"/><path d="M4 20H94" stroke="#2E7A2A" stroke-width="2" opacity=".5"/></symbol>
  </defs></svg>
  <svg style="left:-30px;top:-20px" width="190" height="170" viewBox="0 0 190 170">
    <use href="#leaf" fill="url(#lg)" width="150" height="60" transform="translate(-10 10) rotate(25)"/>
    <use href="#leaf" fill="url(#lg2)" width="130" height="52" transform="translate(-5 60) rotate(5)"/>
    <use href="#leaf" fill="url(#lg)" width="110" height="44" transform="translate(30 -10) rotate(55)"/>
  </svg>
  <svg style="right:-30px;top:-20px;transform:scaleX(-1)" width="190" height="170" viewBox="0 0 190 170">
    <use href="#leaf" fill="url(#lg2)" width="150" height="60" transform="translate(-10 10) rotate(25)"/>
    <use href="#leaf" fill="url(#lg)" width="130" height="52" transform="translate(-5 60) rotate(5)"/>
  </svg>
  <svg style="left:-30px;bottom:-20px" width="180" height="150" viewBox="0 0 180 150">
    <use href="#leaf" fill="url(#lg)" width="150" height="60" transform="translate(-10 120) rotate(-30)"/>
    <use href="#leaf" fill="url(#lg2)" width="120" height="48" transform="translate(10 145) rotate(-60)"/>
  </svg>
  <svg style="right:-30px;bottom:-20px;transform:scaleX(-1)" width="180" height="150" viewBox="0 0 180 150">
    <use href="#leaf" fill="url(#lg2)" width="150" height="60" transform="translate(-10 120) rotate(-30)"/>
    <use href="#leaf" fill="url(#lg)" width="120" height="48" transform="translate(10 145) rotate(-60)"/>
  </svg>
</div>

<div class="app">
  <header>
    <div class="mkWrap" id="mk" data-face="normal"><img alt="원숭이"><span class="fx sweat">💦</span><span class="fx crown">👑</span><span class="fx spark">✨</span></div>
    <div class="logo"><h1>BANANA <span>TEN</span></h1><p>🍌 합 10! 판을 비우면 새 판 +100!</p></div>
  </header>
  <div class="stats">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>BEST</small><b id="best">0</b></div>
    <div class="stat" id="timeBox"><small>TIME</small><b id="time">0</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <main id="main"><div class="frame"><div class="board" id="board"></div></div></main>
  <footer>
    <div class="combo" id="comboBox">COMBO <b id="combo">0</b><span class="rd">🍌 <span id="round">1</span>판</span></div>
    <button id="restart">↻ 다시 시작</button>
  </footer>
</div>

<div class="modal show" id="startModal">
  <div class="card">
    <h2>BANANA TEN</h2>
    <div class="mkWrap" id="sMk" data-face="happy"><img alt="원숭이"><span class="fx sweat">💦</span><span class="fx crown">👑</span><span class="fx spark">✨</span></div>
    <input class="nick" id="nick" maxlength="10" placeholder="닉네임 입력" autocomplete="off" enterkeyhint="go">
    <div class="hint" id="hint">닉네임을 입력하고 시작하세요 (최대 10자)</div>
    <button id="go">게임 시작 🍌</button>
    <div class="rank"><h3>🏆 랭킹 TOP 10</h3><ol id="rankS"></ol><div class="note" id="noteS"></div></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2 id="rTitle">TIME UP!</h2>
    <div class="mkWrap" id="rMk" data-face="normal"><img alt="원숭이"><span class="fx sweat">💦</span><span class="fx crown">👑</span><span class="fx spark">✨</span></div>
    <div class="final" id="rScore">0</div>
    <div class="badge" id="rBadge">★ NEW BEST! ★</div>
    <div class="bonus" id="rBonus"></div>
    <div class="best">BEST <span id="rBest">0</span></div>
    <div class="msg" id="rMsg"></div>
    <button id="again">다시 도전하기</button>
    <div class="rank"><h3>🏆 랭킹 TOP 10</h3><ol id="rankR"></ol><div class="note" id="noteR"></div></div>
  </div>
</div>

  const slow = setTimeout(() => { if (rankState === 'loading'){ rankState = 'slow'; renderRanks(); } }, 10000);
  db.collection('scores').orderBy('best', 'desc').limit(50).onSnapshot(snap => {
    // 동점이면 먼저 달성한 사람이 위 → 같은 순위 없음
    ranks = snap.docs.map(x => ({ id: x.id, ...clean(x.data()) })).filter(r => r.best > 0)
      .sort((a, b) => b.best - a.best || a.at - b.at).slice(0, 10);
    if (!snap.metadata.fromCache){ clearTimeout(slow); rankState = 'live'; }
    renderRanks();
  }, () => { clearTimeout(slow); rankState = 'offline'; renderRanks(); });
  // 재접속 시 내 기록 복원
  try {
    const me = await myDoc.get();
    if (me.exists){
      const r = clean(me.data()); remoteBest = r.best;
      if (r.best > best){ best = r.best; ls.set(KEY, best); $('best').textContent = best; }
      if (!nick){ nick = r.nick; $('nick').value = nick; }
    }
  } catch {}
}
let saving = Promise.resolve();
function saveScore(){
  if (!myDoc || !canWrite) return;
  const body = { nick, best: Math.max(best, remoteBest), at: Date.now() };
  const write = () => myDoc.set(body);
  saving = saving.then(write).catch(e => {
    if (e && e.code === 'unavailable') return new Promise(r => setTimeout(r, 800 + Math.random()*800)).then(write);
    throw e;
  }).catch(e => {
    if (e && e.code === 'invalid_argument'){ canWrite = false; renderRanks(); }
  });
}

const mk = $('mk'), board = $('board');
board.style.gridTemplateColumns = `repeat(${COLS},1fr)`;

function setFace(f, el = mk){ el.dataset.face = f; el.querySelector('img').src = IMG[FACE_IMG[f]]; }
function baseFace(){ return startBest > 0 && score > startBest ? 'best' : 'normal'; }
function flashFace(f, anim){
  setFace(f); mk.classList.remove('bounce','shake'); void mk.offsetWidth; mk.classList.add(anim);
  clearTimeout(faceTimer); faceTimer = setTimeout(() => setFace(baseFace()), 800);
}
function bump(id, v){ const e = $(id); e.textContent = v; e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); }

// 게임판을 남은 공간에 맞춰 최대 크기로
function fit(){
  const m = $('main'), pad = 34, gap = 5;
  const w = Math.min(m.clientWidth - pad, (m.clientHeight - pad - gap*(ROWS-1)) * COLS/ROWS + gap*(COLS-1));
  board.style.width = Math.max(200, w) + 'px';
  board.style.setProperty('--fs', Math.max(14, w/COLS*0.36) + 'px');
}

// 합 10 쌍을 섞어 생성 → 항상 전부 제거 가능
function makeNumbers(){
  const a = [];
  for (let i = 0; i < N/2; i++){ const n = 1 + Math.floor(Math.random()*9); a.push(n, 10 - n); }
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newBoard(anim){
  nums = makeNumbers(); removed = Array(N).fill(false); sel = []; left = N;
  board.innerHTML = nums.map((n,i) => `<div class="tile${anim ? ' drop' : ''}" data-i="${i}" style="animation-delay:${anim ? (i % COLS + Math.floor(i / COLS)) * 18 : 0}ms">${BANANA}<span>${n}</span></div>`).join('');
}
function prepare(){
  score = 0; combo = 0; round = 1; lock = false; playing = false; startBest = best;
  $('round').textContent = 1;
  $('score').textContent = 0; $('best').textContent = best; $('combo').textContent = 0;
  $('comboBox').classList.remove('hot'); $('modal').classList.remove('show');
  newBoard(false);
  setFace('normal'); fit();
  clearInterval(timer); $('time').textContent = LIMIT; $('bar').style.width = '100%';
  $('bar').classList.remove('low'); $('timeBox').classList.remove('low');
}
function go(){
  playing = true; endAt = performance.now() + LIMIT*1000;
  clearInterval(timer); timer = setInterval(tick, 100); tick();
}
function start(){ prepare(); go(); }

function tick(){
  const t = Math.max(0, (endAt - performance.now())/1000), low = t <= 10;
  $('time').textContent = Math.ceil(t);
  $('bar').style.width = (t/LIMIT*100) + '%';
  $('bar').classList.toggle('low', low); $('timeBox').classList.toggle('low', low);
  if (t <= 0) end();
}

function tap(i){
  if (!playing || lock || removed[i]) return;
  const tile = board.children[i];
  if (sel.includes(i)){ sel = sel.filter(x => x !== i); tile.classList.remove('sel'); return; }
  sel.push(i); tile.classList.add('sel');
  if (sel.length === 2) check();
}

function check(){
  const [a, b] = sel, ta = board.children[a], tb = board.children[b];
  sel = [];
  if (nums[a] + nums[b] === 10){
    combo++;
    const gain = 20 + 5*(combo - 1);
    score += gain; removed[a] = removed[b] = true; left -= 2;
    bump('score', score); bump('combo', combo);
    $('comboBox').classList.toggle('hot', combo >= 2);
    if (score > best) $('best').textContent = score;
    [ta, tb].forEach(t => { t.classList.remove('sel'); t.classList.add('gone'); effects(t); });
    floatText(ta, tb, combo >= 2 ? `+${gain} ${combo}COMBO!` : `+${gain}`);
    setTimeout(() => [ta, tb].forEach(t => t.classList.replace('gone','empty')), 390);
    flashFace(startBest > 0 && score > startBest ? 'best' : 'happy', 'bounce');
    if (left === 0){
      // 판을 비우면 보너스 +100, 콤보 유지한 채 새 판으로 계속
      lock = true; score += 100; round++;
      setTimeout(() => {
        bump('score', score); $('round').textContent = round;
        const f = document.createElement('div'); f.className = 'float'; f.textContent = `CLEAR +100! ${round}판`;
        f.style.cssText = `left:50%;top:40%`;
        newBoard(true); board.appendChild(f); setTimeout(() => f.remove(), 850);
        if (score > best) $('best').textContent = score;
        lock = false;
      }, 420);
    }
  } else {
    combo = 0; bump('combo', 0); $('comboBox').classList.remove('hot');
    lock = true;
    [ta, tb].forEach(t => { t.classList.remove('sel'); t.classList.add('bad'); });
    flashFace('sad', 'shake');
    setTimeout(() => { [ta, tb].forEach(t => t.classList.remove('bad')); lock = false; }, 320);
  }
}

function center(t){
  const r = board.getBoundingClientRect(), q = t.getBoundingClientRect();
  return [q.left + q.width/2 - r.left, q.top + q.height/2 - r.top];
}
function effects(t){
  const [x, y] = center(t);
  for (let k = 0; k < 4; k++){
    const s = document.createElement('div'), ang = Math.PI/2*k + Math.PI/4;
    s.className = 'burst'; s.textContent = '✦';
    s.style.cssText = `left:${x}px;top:${y}px;color:${k%2?'#FFD93B':'#fff'};--dx:${Math.cos(ang)*30}px;--dy:${Math.sin(ang)*30}px`;
    board.appendChild(s); setTimeout(() => s.remove(), 600);
  }
}
function floatText(ta, tb, txt){
  const [x1, y1] = center(ta), [x2, y2] = center(tb);
  const f = document.createElement('div');
  f.className = 'float'; f.textContent = txt;
  f.style.left = Math.min(Math.max((x1+x2)/2, 60), board.clientWidth - 60) + 'px';
  f.style.top = ((y1+y2)/2 - 30) + 'px';
  board.appendChild(f); setTimeout(() => f.remove(), 850);
}

function end(){
  if (!playing) return;
  playing = false; clearInterval(timer); clearTimeout(faceTimer);
  $('score').textContent = score;
  const newBest = score > startBest;
  if (newBest){ best = score; ls.set(KEY, best); saveScore(); }
  $('best').textContent = best;
  const face = newBest && score > 0 ? 'best' : score >= 500 ? 'happy' : score >= 150 ? 'normal' : 'sad';
  setFace(face); setFace(face, $('rMk'));
  $('rTitle').textContent = 'TIME UP!';
  $('rScore').textContent = score; $('rBest').textContent = best;
  $('rBonus').textContent = round > 1 ? `비운 판 ${round - 1}개 · 판 보너스 +${(round - 1)*100}` : '';
  $('rBadge').classList.toggle('show', newBest && score > 0);
  $('rMsg').textContent = { best:'최고 기록 달성! 바나나 왕이야! 🍌', happy:'우와, 바나나 고수! 한 번 더?', normal:'좋아! 콤보를 이어 보자!', sad:'아쉬워… 다시 해 보자!' }[face];
  setTimeout(() => $('modal').classList.add('show'), 300);
}

board.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile'); if (t){ e.preventDefault(); tap(+t.dataset.i); }
});
$('restart').onclick = start;
$('again').onclick = start;
addEventListener('resize', fit);
document.addEventListener('dblclick', e => e.preventDefault());
// 시작 화면: 닉네임 입력
setFace('happy', $('sMk'));
$('nick').value = nick;
function begin(){
  const v = $('nick').value.trim().replace(/\s+/g, ' ');
  if (!v){ $('hint').textContent = '닉네임을 입력해 주세요!'; $('hint').classList.add('err'); $('nick').focus(); return; }
  const changed = v !== nick;
  nick = v; ls.set(NICK_KEY, nick);
  if (changed && best > 0) saveScore();  // 닉네임 변경 시 랭킹 이름도 갱신
  $('nick').blur(); $('startModal').classList.remove('show');
  go();
}
$('go').onclick = begin;
$('nick').addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });
$('nick').addEventListener('input', () => { $('hint').classList.remove('err'); $('hint').textContent = '닉네임을 입력하고 시작하세요 (최대 10자)'; });
prepare(); renderRanks(); initOnline();
</script>
</body>
</html>
